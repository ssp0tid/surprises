{% extends "base.html" %}

{% block title %}Error {{ error_code }} - MailCatcher{% endblock %}

{% block content %}
<div class="error-page">
    <h1 class="error-code">{{ error_code }}</h1>
    <p class="error-message">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Go to Email List</a>
</div>
{% endblock %}
