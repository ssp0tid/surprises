{% extends "base.html" %}
{% block title %}{{ code }} — Invoicely{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center py-20">
    <h1 class="text-6xl font-bold text-gray-300 mb-4">{{ code }}</h1>
    <p class="text-lg text-gray-600 mb-6">{{ message }}</p>
    <a href="{{ url_for('dashboard') }}" class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-indigo-700">Back to Dashboard</a>
</div>
{% endblock %}
