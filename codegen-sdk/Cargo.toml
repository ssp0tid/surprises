[package]
name = "codegen-sdk"
version = "0.1.0"
edition = "2021"
description = "CLI tool for generating typed client SDKs from OpenAPI specs"
authors = ["Developer"]
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

validator = { version = "0.16", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = "1.0"
anyhow = "1.0"

chrono = "0.4"
dirs = "5.0"
walkdir = "2.4"
regex = "1.10"
url = "2.5"

toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
insta = "1.38"
tempfile = "3.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
