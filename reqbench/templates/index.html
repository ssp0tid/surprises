<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReqBench</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col overflow-hidden">
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-2 flex items-center justify-between shrink-0">
        <h1 class="text-lg font-bold text-indigo-400">ReqBench</h1>
        <div class="flex items-center gap-3">
            <label class="text-sm text-gray-400">Environment:</label>
            <select id="active-env" class="bg-gray-700 text-sm rounded px-2 py-1 border border-gray-600 focus:outline-none focus:border-indigo-500">
                <option value="">None</option>
            </select>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-gray-850 border-r border-gray-700 flex flex-col shrink-0 overflow-hidden">
            <nav class="flex border-b border-gray-700 shrink-0">
                <button data-sidebar-tab="history" class="sidebar-tab flex-1 px-3 py-2 text-sm font-medium text-gray-400 hover:text-white border-b-2 border-transparent transition-colors active">History</button>
                <button data-sidebar-tab="collections" class="sidebar-tab flex-1 px-3 py-2 text-sm font-medium text-gray-400 hover:text-white border-b-2 border-transparent transition-colors">Collections</button>
                <button data-sidebar-tab="environments" class="sidebar-tab flex-1 px-3 py-2 text-sm font-medium text-gray-400 hover:text-white border-b-2 border-transparent transition-colors">Envs</button>
            </nav>

            <!-- History Panel -->
            <div id="panel-history" class="sidebar-panel flex-1 overflow-y-auto p-2 space-y-1">
                <div class="flex justify-end mb-2">
                    <button onclick="clearHistory()" class="text-xs text-red-400 hover:text-red-300">Clear All</button>
                </div>
                <div id="history-list"></div>
            </div>

            <!-- Collections Panel -->
            <div id="panel-collections" class="sidebar-panel flex-1 overflow-y-auto p-2 space-y-1 hidden">
                <div id="collections-list"></div>
            </div>

            <!-- Environments Panel -->
            <div id="panel-environments" class="sidebar-panel flex-1 overflow-y-auto p-2 space-y-2 hidden">
                <div class="space-y-2">
                    <input id="env-name" type="text" placeholder="Environment name" class="w-full bg-gray-700 rounded px-2 py-1 text-sm border border-gray-600 focus:outline-none focus:border-indigo-500">
                    <div id="env-vars" class="space-y-1"></div>
                    <div class="flex gap-2">
                        <button onclick="addEnvVar()" class="text-xs text-indigo-400 hover:text-indigo-300">+ Add Variable</button>
                        <button onclick="saveEnvironment()" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-2 py-1 rounded">Save</button>
                    </div>
                </div>
                <hr class="border-gray-700">
                <div id="environments-list"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Request Builder -->
            <div class="p-4 space-y-3 border-b border-gray-700 shrink-0">
                <!-- URL Bar -->
                <div class="flex gap-2">
                    <select id="req-method" class="bg-gray-700 rounded px-3 py-2 font-mono text-sm border border-gray-600 focus:outline-none focus:border-indigo-500 w-28">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="PATCH">PATCH</option>
                        <option value="DELETE">DELETE</option>
                        <option value="HEAD">HEAD</option>
                        <option value="OPTIONS">OPTIONS</option>
                    </select>
                    <input id="req-url" type="text" placeholder="https://api.example.com/endpoint" class="flex-1 bg-gray-700 rounded px-3 py-2 text-sm font-mono border border-gray-600 focus:outline-none focus:border-indigo-500">
                    <button onclick="sendRequest()" id="btn-send" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded font-medium text-sm transition-colors">Send</button>
                </div>

                <!-- Request Options Tabs -->
                <div class="flex gap-1 border-b border-gray-700">
                    <button data-req-tab="params" class="req-tab px-3 py-1.5 text-sm text-gray-400 hover:text-white border-b-2 border-transparent transition-colors active">Params</button>
                    <button data-req-tab="headers" class="req-tab px-3 py-1.5 text-sm text-gray-400 hover:text-white border-b-2 border-transparent transition-colors">Headers</button>
                    <button data-req-tab="body" class="req-tab px-3 py-1.5 text-sm text-gray-400 hover:text-white border-b-2 border-transparent transition-colors">Body</button>
                </div>

                <!-- Params -->
                <div id="tab-params" class="req-tab-panel">
                    <div id="params-list" class="space-y-1"></div>
                    <button onclick="addParamRow()" class="text-xs text-indigo-400 hover:text-indigo-300 mt-1">+ Add Param</button>
                </div>

                <!-- Headers -->
                <div id="tab-headers" class="req-tab-panel hidden">
                    <div id="headers-list" class="space-y-1"></div>
                    <button onclick="addHeaderRow()" class="text-xs text-indigo-400 hover:text-indigo-300 mt-1">+ Add Header</button>
                </div>

                <!-- Body -->
                <div id="tab-body" class="req-tab-panel hidden">
                    <div class="flex gap-2 mb-2">
                        <label class="flex items-center gap-1 text-sm">
                            <input type="radio" name="body-type" value="json" checked class="text-indigo-500"> JSON
                        </label>
                        <label class="flex items-center gap-1 text-sm">
                            <input type="radio" name="body-type" value="form" class="text-indigo-500"> Form
                        </label>
                        <label class="flex items-center gap-1 text-sm">
                            <input type="radio" name="body-type" value="text" class="text-indigo-500"> Text
                        </label>
                    </div>
                    <textarea id="req-body" rows="5" placeholder='{"key": "value"}' class="w-full bg-gray-700 rounded px-3 py-2 text-sm font-mono border border-gray-600 focus:outline-none focus:border-indigo-500 resize-y"></textarea>
                </div>

                <!-- Save to Collection -->
                <div class="flex gap-2 items-center">
                    <input id="save-collection-name" type="text" placeholder="Collection name" class="bg-gray-700 rounded px-2 py-1 text-sm border border-gray-600 focus:outline-none focus:border-indigo-500 w-40">
                    <input id="save-request-name" type="text" placeholder="Request name" class="bg-gray-700 rounded px-2 py-1 text-sm border border-gray-600 focus:outline-none focus:border-indigo-500 w-40">
                    <button onclick="saveToCollection()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded border border-gray-600">Save to Collection</button>
                </div>
            </div>

            <!-- Response Viewer -->
            <div class="flex-1 overflow-y-auto p-4">
                <div id="response-panel" class="hidden space-y-3">
                    <div class="flex items-center gap-4">
                        <span id="resp-status" class="font-mono font-bold text-lg"></span>
                        <span id="resp-time" class="text-sm text-gray-400"></span>
                        <span id="resp-size" class="text-sm text-gray-400"></span>
                    </div>

                    <div>
                        <h3 class="text-sm font-medium text-gray-400 mb-1">Response Headers</h3>
                        <div id="resp-headers" class="bg-gray-800 rounded p-2 text-xs font-mono overflow-x-auto max-h-40 overflow-y-auto"></div>
                    </div>

                    <div>
                        <h3 class="text-sm font-medium text-gray-400 mb-1">Response Body</h3>
                        <pre id="resp-body" class="bg-gray-800 rounded p-3 text-sm font-mono overflow-x-auto max-h-96 overflow-y-auto whitespace-pre-wrap break-words"></pre>
                    </div>
                </div>

                <div id="response-error" class="hidden">
                    <div class="bg-red-900/30 border border-red-700 rounded p-4 text-red-300"></div>
                </div>

                <div id="response-placeholder" class="flex items-center justify-center h-full text-gray-500">
                    <p>Send a request to see the response here</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
