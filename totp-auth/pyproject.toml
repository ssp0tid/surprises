[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "totp-auth"
version = "0.1.0"
description = "CLI TOTP/HOTP Authenticator with encrypted storage"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "dev@example.com"}
]
keywords = ["2fa", "totp", "hotp", "authenticator", "cli", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]

dependencies = [
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
    "Pillow>=10.0.0",
    "cryptography>=41.0.0",
    "click>=8.1.0",
    "pyperclip>=1.8.0",
    "pyzbar>=0.1.dev8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "hypothesis>=6.0.0",
]

[project.scripts]
totp-auth = "totpauth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["totpauth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["totpauth"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]