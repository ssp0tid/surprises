{% extends "base.html" %}
{% block title %}{% if editing %}Edit{% else %}Add{% endif %} Subscription{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">{% if editing %}Edit{% else %}Add{% endif %} Subscription</h1>

    <form method="post" class="bg-white rounded-lg shadow p-6 space-y-5">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name <span class="text-red-500">*</span></label>
            <input type="text" id="name" name="name" required
                   value="{{ subscription.name if subscription else '' }}"
                   class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="e.g. Netflix">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                <select id="category" name="category" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if subscription and subscription.category == cat %}selected{% endif %}>{{ cat | capitalize }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="currency" class="block text-sm font-medium text-gray-700 mb-1">Currency</label>
                <select id="currency" name="currency" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                    {% for cur in currencies %}
                    <option value="{{ cur }}" {% if subscription and subscription.currency == cur %}selected{% endif %}>{{ cur }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Amount <span class="text-red-500">*</span></label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" required
                       value="{{ subscription.amount if subscription else '' }}"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500"
                       placeholder="9.99">
            </div>
            <div>
                <label for="billing_cycle" class="block text-sm font-medium text-gray-700 mb-1">Billing Cycle</label>
                <select id="billing_cycle" name="billing_cycle" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                    {% for cycle in billing_cycles %}
                    <option value="{{ cycle }}" {% if subscription and subscription.billing_cycle == cycle %}selected{% endif %}>{{ cycle | capitalize }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div>
            <label for="next_renewal" class="block text-sm font-medium text-gray-700 mb-1">Next Renewal Date <span class="text-red-500">*</span></label>
            <input type="date" id="next_renewal" name="next_renewal" required
                   value="{{ subscription.next_renewal if subscription else '' }}"
                   class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label for="url" class="block text-sm font-medium text-gray-700 mb-1">Service URL</label>
            <input type="url" id="url" name="url"
                   value="{{ subscription.url if subscription else '' }}"
                   class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="https://example.com">
        </div>

        <div>
            <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
            <textarea id="notes" name="notes" rows="3"
                      class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500"
                      placeholder="Optional notes...">{{ subscription.notes if subscription else '' }}</textarea>
        </div>

        <div class="flex items-center gap-4 pt-2">
            <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-500 text-sm font-medium">
                {% if editing %}Update{% else %}Add{% endif %} Subscription
            </button>
            <a href="{{ url_for('list_subscriptions') }}" class="text-gray-600 hover:text-gray-800 text-sm">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
