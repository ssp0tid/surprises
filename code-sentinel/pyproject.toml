[project]
name = "code-sentinel"
version = "0.1.0"
description = "AI-powered local code review assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python>=0.2.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
]

[project.scripts]
code-sentinel = "code_sentinel.cli:app"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
