{% extends "base.html" %}

{% block title %}Settings - Habitbeat{% endblock %}

{% block content %}
<div class="settings-page">
    <h1>Settings</h1>

    <div class="section">
        <h2>Profile</h2>
        <form id="profile-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" disabled>
            </div>
        </form>
    </div>

    <div class="section">
        <h2>Categories</h2>
        <div id="categories-list"></div>
        <form id="create-category-form" class="inline-form">
            <input type="text" id="category-name" placeholder="New category name">
            <input type="text" id="category-color" placeholder="#6366f1">
            <button type="submit" class="btn btn-small">Add</button>
        </form>
    </div>

    <div class="section">
        <h2>API Access</h2>
        <p>Use your API token to access the REST API:</p>
        <code id="api-token"></code>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadSettings() {
    const token = localStorage.getItem('token');
    document.getElementById('api-token').textContent = token;

    try {
        const response = await fetch('/api/categories', {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            const data = await response.json();
            renderCategories(data.categories);
        }
    } catch (error) {
        console.error('Error loading settings:', error);
    }
}

function renderCategories(categories) {
    const container = document.getElementById('categories-list');
    container.innerHTML = categories.map(cat => `
        <div class="category-item" style="border-left-color: ${cat.color}">
            <span>${cat.name}</span>
        </div>
    `).join('');
}

document.getElementById('create-category-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('category-name').value;
    const color = document.getElementById('category-color').value;

    try {
        const token = localStorage.getItem('token');
        await fetch('/api/categories', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name, color })
        });
        loadSettings();
    } catch (error) {
        console.error('Error creating category:', error);
    }
});

loadSettings();
</script>
{% endblock %}
