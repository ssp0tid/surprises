{% extends "base.html" %}

{% block title %}Query History - SQL Playground{% endblock %}

{% block content %}
<div class="history-page">
    <div class="page-header">
        <h1>Query History</h1>
        <div class="header-actions">
            <button id="btn-clear-all" class="btn btn-danger">Clear All History</button>
        </div>
    </div>
    
    <div id="history-list" class="history-list">
        <div class="loading">Loading history...</div>
    </div>
    
    <div id="history-pagination" class="pagination-container hidden">
        <div class="pagination">
            <button id="prev-page" class="btn btn-secondary btn-small">← Previous</button>
            <span id="page-info">Page 1 of 1</span>
            <button id="next-page" class="btn btn-secondary btn-small">Next →</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // History page specific configuration
    window.HISTORY_PAGE = true;
</script>
<script src="{{ url_for('static', filename='js/query-history.js') }}"></script>
{% endblock %}
