<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pollcraft{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tight">Pollcraft</a>
            <a href="/create" class="bg-indigo-500 hover:bg-indigo-400 px-4 py-2 rounded text-sm font-medium transition">
                New Poll
            </a>
        </div>
    </nav>

    <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-8">
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-6">
            {{ error }}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-gray-400 text-sm py-4">
        Pollcraft &mdash; Real-time polls, no login required.
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
